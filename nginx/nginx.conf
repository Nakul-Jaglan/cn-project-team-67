worker_processes 1;
pid /tmp/cn-phase1-nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/cn-phase1-nginx-access.log;
    error_log /tmp/cn-phase1-nginx-error.log info;

    upstream phase1_backends {
        server 10.7.15.25:3001 max_fails=1 fail_timeout=5s;
        server 10.7.21.130:3002 max_fails=1 fail_timeout=5s;

        keepalive 8;
    }

    server {
        listen 8443 ssl;

        server_name app.team67.test api.team67.test;

        ssl_certificate
            /Users/sudeshhnabehera/cn-phase1/certs/app.team67.test.crt;


        ssl_certificate_key
            /Users/sudeshhnabehera/cn-phase1/certs/app.team67.test.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://phase1_backends;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            proxy_next_upstream
                error timeout http_502 http_503 http_504;

            proxy_next_upstream_tries 2;
        }
    }
}


